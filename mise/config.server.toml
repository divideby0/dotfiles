# mise configuration for servers/NAS (linked as ~/.config/mise/config.toml on Synology)
# Lean CLI toolset - language runtimes and k8s/cloud tooling stay on the workstation.
# Versions track config.toml where the tool appears in both.

[settings]
experimental = true
auto_install = false
trusted_config_paths = ["~"]

[tools]
bat = "latest"
eza = "0.23.4"
gh = "latest"
just = "1.52.0"
starship = "1.25.1"
uv = "0.11.21"
zellij = "0.44.3"
